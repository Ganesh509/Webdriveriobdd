version: '3.8'

services:
  selenium-hub:
    image: selenium/hub:4.11.0-20240214
    container_name: selenium-hub
    ports:
      - "4444:4444"
    environment:
      - SE_OPTS=-host 0.0.0.0

  node-chrome:
    image: selenium/node-chrome:4.11.0-20240214
    container_name: selenium-node-chrome
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    shm_size: 2gb

  node-chrome-debug:
    image: selenium/node-chrome-debug:4.11.0-20240214
    container_name: selenium-node-chrome-debug
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - VNC_NO_PASSWORD=1
    ports:
      - "7900:7900"
    shm_size: 2gb

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wdio-tests
    depends_on:
      - selenium-hub
      - node-chrome
    environment:
      - USE_DOCKER=true
      - SELENIUM_HOST=selenium-hub
      - SELENIUM_PORT=4444
      - SELENIUM_PATH=/
      - TAGS=${TAGS}
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm test

volumes:
  node_modules:
    driver: local
